name: Update stardate

on:
  schedule:
    # 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stardate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update stardate in footer SVG
        run: python3 scripts/update_stardate.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain assets/lcars/footer-status.svg)" ]]; then
            echo "No stardate change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lcars/footer-status.svg
          git commit -m "chore: update stardate"
          git push
